<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond Executive - Beta -</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #4caf50;
            --accent-hover: #45a049;
            --danger: #f44336;
            --border: #333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.5rem; color: #90caf9; }
        .stats-bar { display: flex; gap: 20px; font-size: 1.2rem; font-weight: bold; }
        .container {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .left-panel { flex: 1; min-width: 250px; }
        .right-panel { flex: 2; overflow-y: auto; }
        
        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        h2 { font-size: 1.2rem; margin-top: 0; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: center; }
        th { background-color: #2c2c2c; }
        
        .log-window {
            background-color: #000;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            border-radius: 4px;
            margin-top: auto;
            border: 1px solid #333;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px dashed #333; padding-bottom: 2px;}
    </style>
</head>
<body>

    <header>
        <h1>Diamond Executive <span style="font-size:0.8rem; color:#888;">Beta Build</span></h1>
        <div class="stats-bar">
            <div>資金: ¥<span id="funds">1000</span>万</div>
            <div>成績: <span id="wins">0</span>勝 <span id="losses">0</span>敗</div>
            <div>試合数: <span id="games">0</span>/143</div>
        </div>
    </header>

    <div class="container">
        <!-- 左パネル：コマンド＆ログ -->
        <div class="panel left-panel">
            <h2>GMコマンド</h2>
            <button id="btn-play" onclick="playGame()">1試合進行</button>
            <button id="btn-scout" onclick="scoutPlayer()">スカウト実行 (¥100万)</button>
            
            <h2 style="margin-top: 20px;">チーム総合力</h2>
            <p>打撃力: <span id="team-batting">0</span></p>
            <p>投手力: <span id="team-pitching">0</span></p>

            <h2 style="margin-top: 20px;">システムログ</h2>
            <div class="log-window" id="log-window"></div>
        </div>

        <!-- 右パネル：ロスター（名簿） -->
        <div class="panel right-panel">
            <h2>所属選手ロスター</h2>
            <table>
                <thead>
                    <tr>
                        <th>名前</th>
                        <th>役割</th>
                        <th>巧打/球威</th>
                        <th>長打/制球</th>
                        <th>選球/変化</th>
                        <th>総合力(OVR)</th>
                        <th>年俸</th>
                    </tr>
                </thead>
                <tbody id="roster-body">
                    <!-- JavaScriptで描画 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- データモデル ---
        const lastNames = ["鈴木", "佐藤", "田中", "高橋", "伊藤", "渡辺", "山本", "中村", "小林", "加藤", "吉田", "山田", "佐々木", "山口", "松本", "井上", "木村", "林", "斎藤"];
        
        class Player {
            constructor(role) {
                this.name = lastNames[Math.floor(Math.random() * lastNames.length)];
                this.role = role; // "野手" or "投手"
                // 1〜100のパラメーター
                this.stat1 = Math.floor(Math.random() * 60) + 20; 
                this.stat2 = Math.floor(Math.random() * 60) + 20;
                this.stat3 = Math.floor(Math.random() * 60) + 20;
                this.ovr = Math.floor((this.stat1 + this.stat2 + this.stat3) / 3);
                this.salary = Math.floor(this.ovr * 0.5) + 10; // 年俸(万円)
            }
        }

        // --- ステート管理 ---
        let state = {
            funds: 1000,
            wins: 0,
            losses: 0,
            games: 0,
            roster: [],
            teamBatting: 0,
            teamPitching: 0
        };

        // --- 初期化 ---
        function init() {
            log("GM就任おめでとうございます。チーム編成を開始します。");
            // 初期メンバー生成（野手5名、投手3名）
            for(let i=0; i<5; i++) state.roster.push(new Player("野手"));
            for(let i=0; i<3; i++) state.roster.push(new Player("投手"));
            updateUI();
        }

        // --- コアロジック ---
        function updateUI() {
            document.getElementById('funds').innerText = state.funds;
            document.getElementById('wins').innerText = state.wins;
            document.getElementById('losses').innerText = state.losses;
            document.getElementById('games').innerText = state.games;

            // 総合力計算
            let batTotal = 0;
            let pitTotal = 0;
            let batCount = 0;
            let pitCount = 0;

            const tbody = document.getElementById('roster-body');
            tbody.innerHTML = '';

            state.roster.forEach(p => {
                if(p.role === "野手") { batTotal += p.ovr; batCount++; }
                else { pitTotal += p.ovr; pitCount++; }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.name}</td>
                    <td>${p.role}</td>
                    <td>${p.stat1}</td>
                    <td>${p.stat2}</td>
                    <td>${p.stat3}</td>
                    <td><strong>${p.ovr}</strong></td>
                    <td>¥${p.salary}万</td>
                `;
                tbody.appendChild(tr);
            });

            state.teamBatting = batCount > 0 ? Math.floor(batTotal) : 0;
            state.teamPitching = pitCount > 0 ? Math.floor(pitTotal) : 0;
            document.getElementById('team-batting').innerText = state.teamBatting;
            document.getElementById('team-pitching').innerText = state.teamPitching;

            // ボタン制御
            document.getElementById('btn-scout').disabled = state.funds < 100;
            document.getElementById('btn-play').disabled = state.games >= 143;
        }

        function log(msg) {
            const window = document.getElementById('log-window');
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerText = `> ${msg}`;
            window.insertBefore(div, window.firstChild);
        }

        // --- アクション ---
        function scoutPlayer() {
            if (state.funds < 100) return;
            state.funds -= 100;
            const role = Math.random() > 0.5 ? "野手" : "投手";
            const newPlayer = new Player(role);
            
            // 稀に覚醒選手
            if (Math.random() > 0.85) {
                newPlayer.stat1 += 20; newPlayer.stat2 += 20; newPlayer.stat3 += 20;
                newPlayer.ovr = Math.floor((newPlayer.stat1 + newPlayer.stat2 + newPlayer.stat3) / 3);
            }

            state.roster.push(newPlayer);
            log(`スカウト成功！ ${newPlayer.name}（${newPlayer.role} | OVR:${newPlayer.ovr}）を獲得しました。`);
            updateUI();
        }

        function playGame() {
            if (state.games >= 143) return;

            // 敵チームのランダム生成（ゲーム進行度に合わせて少し強くなる）
            const enemyBatting = 150 + Math.floor(Math.random() * 100) + (state.games * 0.5);
            const enemyPitching = 150 + Math.floor(Math.random() * 100) + (state.games * 0.5);

            // シミュレーション（自チーム打撃 vs 敵投手 / 敵打撃 vs 自チーム投手）
            // 乱数（運）要素を加味
            const myScoreBase = (state.teamBatting - enemyPitching) / 20;
            const enemyScoreBase = (enemyBatting - state.teamPitching) / 20;

            let myScore = Math.max(0, Math.floor(myScoreBase + (Math.random() * 5)));
            let enemyScore = Math.max(0, Math.floor(enemyScoreBase + (Math.random() * 5)));

            // 引き分けの場合は乱数で決着
            if (myScore === enemyScore) {
                Math.random() > 0.5 ? myScore++ : enemyScore++;
            }

            let income = 0;
            if (myScore > enemyScore) {
                state.wins++;
                income = 30 + Math.floor(Math.random() * 20); // 勝利報酬（観客増）
                log(`第${state.games + 1}戦: ○ ${myScore} - ${enemyScore} で勝利！ (観客収入: +¥${income}万)`);
            } else {
                state.losses++;
                income = 10 + Math.floor(Math.random() * 10); // 敗北報酬
                log(`第${state.games + 1}戦: ● ${myScore} - ${enemyScore} で敗北... (観客収入: +¥${income}万)`);
            }

            state.funds += income;
            state.games++;

            if (state.games === 143) {
                log(`【シーズン終了】成績: ${state.wins}勝 ${state.losses}敗。来季に向けて編成を行いましょう！`);
            }

            updateUI();
        }

        // 起動
        init();
    </script>
</body>
</html>
