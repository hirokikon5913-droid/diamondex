<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diamond Executive - Beta V4 -</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1 class="header-title">Diamond Executive <span id="owner-trust">支持率:100%</span></h1>
            <div class="calendar-display" id="current-date">1年目 3月 (開幕)</div>
            <div class="status-grid">
                <div class="status-item">資金<span class="status-val" id="funds">¥5000万</span></div>
                <div class="status-item">成績<span class="status-val" id="record">0勝0敗</span></div>
                <div class="status-item">人気度<span class="status-val" id="popularity">D</span></div>
            </div>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="app.switchTab('tab-dash')">GMデスク</button>
            <button class="tab-btn" onclick="app.switchTab('tab-roster')">編成(スタメン)</button>
            <button class="tab-btn" onclick="app.switchTab('tab-front')">フロント人事</button>
        </div>

        <!-- タブ1: GMデスク (試合と進行) -->
        <div id="tab-dash" class="tab-content active">
            <div class="alert-box" id="validation-alert">⚠️ エラー</div>
            
            <h2 class="section-title">本日のスケジュール</h2>
            <div class="match-modes">
                <button class="btn-action" onclick="app.playMatch(1)">⚾ 1球進行 (観戦)</button>
                <button class="btn-action" onclick="app.playMatch(2)">⚾ ダイジェスト</button>
                <button class="btn-action" onclick="app.playMatch(3)">⚾ 結果スキップ</button>
            </div>
            <button class="btn-secondary" onclick="app.advanceDay()">試合なしで1日進む</button>
            
            <h2 class="section-title">実況・システムログ</h2>
            <div class="log-window" id="log-window"></div>
        </div>

        <!-- タブ2: 編成 (スタメンと適性) -->
        <div id="tab-roster" class="tab-content">
            <h2 class="section-title">スタメンオーダー</h2>
            <button class="btn-secondary" onclick="app.autoSetOrder()">AI自動編成</button>
            <div id="order-list" class="roster-grid"></div>
            
            <h2 class="section-title">ベンチ・控え</h2>
            <div id="bench-list" class="roster-grid"></div>
        </div>

        <!-- タブ3: フロント人事と投資 -->
        <div id="tab-front" class="tab-content">
            <h2 class="section-title">球団スタッフ</h2>
            <div id="staff-list"></div>
            <h2 class="section-title">スタジアム改修</h2>
            <button class="btn-scout" onclick="app.upgradeStadium()">ホームランテラス増設 (¥3億)</button>
        </div>
    </div>

    <!-- モジュールの読み込み -->
    <script src="js/models.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
